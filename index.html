<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1219">
  <meta name="robots" content="noindex, nofollow">
  <title>Кросс БПЛА — прототип · Сравни</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Open+Sans:wght@400;600&display=swap">
  <!--
    Экран входа «Password Gate». Сайт лежит рядом в payload.bin — зашифрованным (AES-256-CBC,
    ключ из кода через PBKDF2-SHA256). Код нигде не хранится: верный он или нет, понятно только
    по тому, удалось ли расшифровать пакет.
    После ввода кода файлы сайта кладутся в кэш браузера, а sw.js отдаёт их по адресам ./site/…
    — сайт работает как обычный: относительные ссылки, fetch, несколько страниц.
    Файл собирается скриптом gate/protect.py. Руками правим шаблон gate/lock.html, а не готовый index.html.
  -->
  <style>
    :root {
      --dark-100: #171d23;
      --dark-80: #002a3a;
      --dark-60: #636f7d;
      --dark-15: #dadde2;
      --dark-10: #f5f5f5;
      --blue-100: #00afff;
      --red-100: #f0454f;
      --red-06: #fff1f1;
      --green-100: #2fb36a;
      --font-head: 'Onest', system-ui, sans-serif;
      --font-body: 'Open Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      color: var(--dark-100);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
      /* Фирменный фон Сравни: тёмный верх, синяя волна и фиолетовый снизу */
      background:
        radial-gradient(120% 70% at 0% 100%, rgba(78, 84, 219, 0.95) 0%, rgba(78, 84, 219, 0) 60%),
        radial-gradient(90% 60% at 100% 95%, rgba(41, 186, 254, 0.9) 0%, rgba(41, 186, 254, 0) 60%),
        radial-gradient(110% 55% at 35% 75%, rgba(11, 162, 235, 0.75) 0%, rgba(11, 162, 235, 0) 65%),
        linear-gradient(180deg, #0c141a 0%, #0b1a24 45%, #03202e 100%);
      background-color: #0b1219;
    }

    .logo { display: block; width: 104px; height: auto; }

    .card {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 400px;
      padding: 32px 24px 24px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 2px 12px rgba(0, 0, 0, 0.02);
      transition: opacity 0.35s ease-out, transform 0.35s ease-out;
    }

    .card.is-leaving { opacity: 0; transform: translateY(-12px) scale(0.98); }

    .head { display: flex; flex-direction: column; gap: 8px; text-align: center; }

    .title { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 26px; line-height: 32px; }

    .subtitle { margin: 0; color: var(--dark-60); }

    /* Одно настоящее поле ввода поверх «ячеек»: на телефоне сразу цифровая клавиатура,
       работают вставка и автоподстановка кода */
    .code { position: relative; display: flex; justify-content: center; gap: 12px; }

    .code__cell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 64px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: var(--dark-10);
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 28px;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .code__cell.is-active { border-color: var(--blue-100); background: #fff; }

    .code.is-error .code__cell { border-color: var(--red-100); background: var(--red-06); }
    .code.is-success .code__cell { border-color: var(--green-100); background: #fff; }
    .code.is-error { animation: shake 0.4s ease-in-out; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .code__input {
      position: absolute;
      inset: 0;
      width: 100%;
      opacity: 0;
      font-size: 16px; /* иначе iOS приближает страницу при фокусе */
      cursor: pointer;
    }

    .message { min-height: 20px; margin: -12px 0 0; text-align: center; color: var(--dark-60); }
    .message.is-error { color: var(--red-100); }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 12px;
      background: var(--dark-80);
      color: #fff;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: var(--dark-15); color: #8d96a1; cursor: default; transform: none; }

    .hint { margin: 0; text-align: center; color: var(--dark-60); font-size: 12px; line-height: 16px; }

    @media (max-width: 360px) {
      .code { gap: 8px; }
      .code__cell { width: 48px; height: 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .code.is-error { animation: none; }
      .card { transition: none; }
    }
  </style>
</head>

  <form class="card" novalidate>
    <div class="head">
      <h1 class="title">Привет! Это прототип для&nbsp;своих</h1>
      <p class="subtitle">Введите код из&nbsp;4&nbsp;цифр, чтобы открыть прототип</p>
    </div>

    <div class="code">
      <input class="code__input" type="text" inputmode="numeric" pattern="[0-9]*"
        autocomplete="one-time-code" aria-label="Код доступа" autofocus>
    </div>

    <p class="message" role="status" aria-live="polite"></p>

    <button class="btn" type="submit" disabled>Открыть прототип</button>
    <p class="hint">Код можно узнать у&nbsp;автора прототипа</p>
  </form>

  <script>
    (function () {
      // Параметры подставляет protect.py: число повторов PBKDF2, длина кода, номер сборки, стартовая страница
      var CFG = {"iterations": 600000, "codeLength": 4, "buildId": "516d89381763", "entry": "index.html"};
      var CACHE_PREFIX = 'gate-';
      var CACHE_NAME = CACHE_PREFIX + CFG.buildId;
      var SITE = new URL('site/', location.href).href;
      var ENTRY = SITE + CFG.entry;
      var BUTTON_TEXT = "Открыть прототип";

      var form = document.querySelector('.card');
      var code = document.querySelector('.code');
      var input = document.querySelector('.code__input');
      var message = document.querySelector('.message');
      var button = document.querySelector('.btn');
      var busy = false;

      input.maxLength = CFG.codeLength;
      var cells = [];
      for (var i = 0; i < CFG.codeLength; i++) {
        var cell = document.createElement('div');
        cell.className = 'code__cell';
        cell.setAttribute('aria-hidden', 'true');
        code.insertBefore(cell, input);
        cells.push(cell);
      }

      function setMessage(text, isError) {
        message.textContent = text;
        message.classList.toggle('is-error', !!isError);
      }

      // Без https (или localhost) браузер не даёт ни расшифровку, ни service worker
      var supported = window.isSecureContext && window.crypto && crypto.subtle && 'serviceWorker' in navigator && 'caches' in window;
      if (!supported) {
        setMessage('Откройте ссылку по https в обычном (не приватном) окне браузера', true);
        input.disabled = true;
        return;
      }

      // Этот браузер уже открывал эту сборку — пускаем сразу
      caches.open(CACHE_NAME)
        .then(function (cache) { return cache.match(ENTRY); })
        .then(function (hit) {
          if (!hit) return;
          return navigator.serviceWorker.register('sw.js').then(function () {
            return navigator.serviceWorker.ready;
          }).then(function () { location.replace(ENTRY); });
        })
        .catch(function () { /* покажем форму */ });

      // Пакет качаем сразу — пока человек вводит код, он уже загрузится
      var payload = fetch('payload.bin', { cache: 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error('payload ' + r.status);
        return r.arrayBuffer();
      });

      function render() {
        var value = input.value;
        cells.forEach(function (cell, i) {
          cell.textContent = value[i] || '';
          cell.classList.toggle('is-active', document.activeElement === input && i === Math.min(value.length, CFG.codeLength - 1));
        });
        button.disabled = busy || value.length !== CFG.codeLength;
      }

      input.addEventListener('input', function () {
        input.value = input.value.replace(/\D/g, '').slice(0, CFG.codeLength);
        code.classList.remove('is-error');
        setMessage('');
        render();
        if (input.value.length === CFG.codeLength) submit();
      });
      input.addEventListener('focus', render);
      input.addEventListener('blur', render);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submit();
      });

      // Код → PBKDF2 (соль — первые 16 байт пакета) → 48 байт: ключ AES (32) + вектор (16).
      // Неверный код почти всегда ломает расшифровку; на редкий «случайный успех» проверяем метку GATE
      function decrypt(buffer, value) {
        var salt = buffer.slice(0, 16);
        var data = buffer.slice(16);
        return crypto.subtle
          .importKey('raw', new TextEncoder().encode(value), 'PBKDF2', false, ['deriveBits'])
          .then(function (base) {
            return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: CFG.iterations }, base, 384);
          })
          .then(function (bits) {
            bits = new Uint8Array(bits);
            return crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']).then(function (key) {
              return crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, data);
            });
          })
          .then(
            function (plain) {
              return new TextDecoder().decode(new Uint8Array(plain, 0, 4)) === 'GATE' ? plain : null;
            },
            function () { return null; }
          );
      }

      // Пакет: «GATE» + длина заголовка (4 байта) + заголовок JSON со списком файлов + файлы подряд.
      // Каждый файл кладём в кэш по адресу ./site/<путь>, старые сборки из кэша удаляем
      function install(plain) {
        var headerLength = new DataView(plain).getUint32(4);
        var header = JSON.parse(new TextDecoder().decode(new Uint8Array(plain, 8, headerLength)));
        var start = 8 + headerLength;

        return navigator.serviceWorker.register('sw.js')
          .then(function () { return caches.keys(); })
          .then(function (keys) {
            return Promise.all(keys.filter(function (k) {
              return k.indexOf(CACHE_PREFIX) === 0 && k !== CACHE_NAME;
            }).map(function (k) { return caches.delete(k); }));
          })
          .then(function () { return caches.open(CACHE_NAME); })
          .then(function (cache) {
            return Promise.all(header.files.map(function (f) {
              var body = new Blob([new Uint8Array(plain, start + f.offset, f.length)], { type: f.type });
              return cache.put(SITE + f.path, new Response(body, { headers: { 'Content-Type': f.type } }));
            }));
          })
          .then(function () { return navigator.serviceWorker.ready; });
      }

      function fail(text) {
        busy = false;
        button.textContent = BUTTON_TEXT;
        setMessage(text, true);
        render();
      }

      function submit() {
        var value = input.value;
        if (busy || value.length !== CFG.codeLength) return;
        busy = true;
        button.textContent = 'Проверяем…';
        setMessage('');
        render();

        payload
          .then(function (buffer) { return decrypt(buffer, value); })
          .then(function (plain) {
            if (!plain) {
              code.classList.remove('is-error');
              void code.offsetWidth; // перезапуск «встряски»
              code.classList.add('is-error');
              input.value = '';
              input.focus();
              fail('Код не подошёл. Попробуйте ещё раз');
              return;
            }
            code.classList.add('is-success');
            button.textContent = 'Открываем…';
            return install(plain).then(function () {
              form.classList.add('is-leaving');
              setTimeout(function () { location.replace(ENTRY); }, 350);
            });
          })
          .catch(function () {
            fail('Не получилось открыть. Проверьте интернет и обновите страницу');
          });
      }

      render();
    })();
  </script>
</body>
</html>
